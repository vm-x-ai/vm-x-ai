[project]
name = "api-completion-vm-x-ai-example"
version = "1.0.0"
description = "Runnable Python examples for the VM-X /chat/completions, /responses, /anthropic/messages, and web-search endpoints. Mirrors the snippets shown in docs/docs/features/api/."
requires-python = ">=3.11,<4"
dependencies = [
  "openai>=2.7.0",
  "anthropic>=0.95.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = [ "api_completion_examples" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"
